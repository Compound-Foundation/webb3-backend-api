name: node-provider-proxy Dependency Audit
on:
  # Every pull request runs this audit, whatever it changes, because main
  # requires the check. Fork pull requests get a read-only token and no secrets.
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'node-provider-proxy/**'
      # node-provider-proxy consumes the shared workspace libraries that
      # live under c3-api/lib (fallible, json-rpc, well-known-*).
      - 'c3-api/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/audit-node-provider-proxy.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: node-provider-proxy npm audit (high/critical must pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The repo-root lockfile covers the shared workspace libraries
      # (c3-api/lib/*) that node-provider-proxy builds against.
      - name: Audit shared workspace libraries
        run: npm audit --audit-level=high

      - name: Audit node-provider-proxy
        working-directory: node-provider-proxy
        run: npm audit --audit-level=high
