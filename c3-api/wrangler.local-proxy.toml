# A local run against the node provider proxy running on this machine
# (README.md, Getting Started). It is the default environment of wrangler.toml
# with the proxy bound to the worker the way stage and production bind
# theirs, and the same settings. Start the proxy from ../node-provider-proxy,
# with its dependencies installed there (npm install) and its provider keys in
# its own .dev.vars, then the worker:
#
#   npm start -- --port 8788        (in ../node-provider-proxy)
#   npx wrangler dev --local -c wrangler.local-proxy.toml entrypoint.ts
#
# A NODE_PROXY_HOST in .dev.vars overrides the one below, and with it the
# binding: leave it unset there. tests/lib/wrangler-local-proxy.test.ts holds
# this file to wrangler.toml.
main = "./entrypoint"

compatibility_date = "2026-06-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

name = "v3-api-local"

kv_namespaces = [
    { binding = "kv_testnet", preview_id = "local:kv_testnet", id = "nil" },
    { binding = "kv_mainnet", preview_id = "local:kv_mainnet", id = "nil" },
]

# node-provider-proxy-local is the name of the proxy's default environment
services = [
    { binding = "node_provider_proxy", service = "node-provider-proxy-local" },
]

[vars]
DEBUG = "fetch"
ENVIRONMENT = "local"
MEMORY_CACHE_SEED = "local"
V3_API_HOST = "your-domain-host_XXX"
# never resolved: a request to this host goes through the binding instead
NODE_PROXY_HOST = "node-provider-proxy.invalid"
NODE_PROXY_KEY = "optional-node-proxy-key_XXX"
BLOCK_NATIVE_API_KEY = "optional-BN-key_XXX"
FLAGS_ETH_COMPUTATION_INDEX_BIAS = "default"

[[vars.URL_SERVICE_BINDING_OVERRIDES]]
host    = "node-provider-proxy.invalid"
binding = "node_provider_proxy"
